name: TRMNL Refresh
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Provision Headless Chrome Locally
        run: npx puppeteer browsers install chrome
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer

      - name: Install OS Dependencies & ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick libnss3 libnspr4 libgbm1 libasound2t64
        
      - name: Capture Dashboard
        run: node capture.js
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
          
      - name: Force 4-bit Grayscale
        run: convert raw.png -colorspace Gray -colors 16 -depth 4 final.png
        
      - name: Push to TRMNL
        run: |
          curl -X POST -H "Content-Type: image/png" --data-binary @final.png "${{ secrets.TRMNL_WEBHOOK }}"
