name: TRMNL Refresh
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      
      - name: Capture Dashboard
        run: node capture.js
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          
      - name: Force 4-bit Grayscale
        run: convert raw.png -colorspace Gray -colors 16 -depth 4 final.png
        
      - name: Push to TRMNL
        run: curl -X POST -H "Content-Type: image/png" --data-binary @final.png "${{ secrets.TRMNL_WEBHOOK }}"
