name: TRMNL Refresh
on:
  schedule:
    - cron: '0 * * * *' # Once an hour
  workflow_dispatch:   # The "Run Now" button

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node capture.js
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          TRMNL_WEBHOOK: ${{ secrets.TRMNL_WEBHOOK }}
